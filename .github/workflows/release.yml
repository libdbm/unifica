name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'

# Actions are pinned to full commit SHAs; the comment names the release.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate tag matches pom.xml version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          POM_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Tag version: $TAG_VERSION"
          echo "POM version: $POM_VERSION"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match pom.xml version ($POM_VERSION)"
            exit 1
          fi
          echo "Version validation passed"
          echo "VERSION=$POM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./mvnw clean verify

      - name: Show Maven version
        run: ./mvnw -v

      - name: Publish to Maven Central
        run: ./mvnw deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # The staging directory is what the Central bundle is built from; listed even when publishing fails.
      - name: List Central staging
        if: always()
        run: find target/central-staging -type f | sort || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            target/*.jar
            target/bom.json
            target/bom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
